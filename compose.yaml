services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /app/data/social.db
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      RATE_LIMIT_ENABLED: "true"
    volumes:
      - social-data:/app/data
    restart: unless-stopped
volumes:
  social-data:
